<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Cost-Effective Life — English / Tiếng Việt</title>
<meta name="description" content="Unofficial English and Vietnamese reader for 高性价比人生指南 (A Cost-Effective Life Guide). 650 evidence-graded entries on lifespan, money, time and legal risk. The Chinese original is authoritative.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#fdfdfc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b55c9'/%3E%3Cpath d='M17 33l10 11 20-24' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
/* Theme before first paint, so the page never flashes the wrong one. */
(function(){try{var s=localStorage.getItem('hltb-i18n-theme');
var d=s?s==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
<style>
:root{
  --bg:#fdfdfc; --surface:#ffffff; --sunken:#f4f4f2; --hover:#efeff2;
  --ink:#1a1a1f; --ink2:#55555f; --ink3:#86868f;
  --line:#e6e6e3; --line2:#f0f0ee;
  --brand:#5b55c9; --brand-ink:#423dad; --brand-wash:#eeedfb;
  --gA:#1a7f46; --gA-bg:#e6f4ec; --gB:#9a6510; --gB-bg:#fbf0dd; --gC:#5f6672; --gC-bg:#eff1f4;
  --v3:#7b2d8e; --v3-bg:#f7ebfa; --v2:#1d52c9; --v2-bg:#e9effc; --v1:#6b7280; --v1-bg:#f1f2f5;
  --warn:#8a3d12; --warn-bg:#fdf1e9; --warn-line:#f2d6c3;
  --ring:0 0 0 3px var(--brand-wash);
  --sh1:0 1px 2px rgba(26,26,31,.04);
  --sh2:0 2px 4px rgba(26,26,31,.05), 0 8px 24px rgba(26,26,31,.06);
  --r:14px; --r2:10px; --r3:8px;
}
:root[data-theme="dark"]{
  --bg:#16161a; --surface:#1d1d22; --sunken:#212128; --hover:#2a2a32;
  --ink:#eeeef2; --ink2:#b2b2bd; --ink3:#83838f;
  --line:#2e2e36; --line2:#26262d;
  --brand:#a9a2f5; --brand-ink:#c0b9ff; --brand-wash:#272348;
  --gA:#5ecd89; --gA-bg:#16301f; --gB:#dfb155; --gB-bg:#32280f; --gC:#99a1ae; --gC-bg:#23252b;
  --v3:#d79aea; --v3-bg:#2d1b33; --v2:#8db0f8; --v2-bg:#1a2340; --v1:#99a1ae; --v1-bg:#23252b;
  --warn:#efa87d; --warn-bg:#2f1d12; --warn-line:#49301e;
  --sh1:0 1px 2px rgba(0,0,0,.3);
  --sh2:0 2px 4px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scrollbar-gutter:stable}
body{
  margin:0; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
    "Noto Sans","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brand); text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none; padding:0}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}
.wrap{max-width:860px; margin:0 auto; padding:0 20px}
@media (max-width:560px){ .wrap{padding:0 16px} }

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line);
}
.hrow{display:flex; align-items:center; gap:12px; height:58px}
.logo{display:flex; align-items:center; gap:9px; margin-right:auto; min-width:0}
.mark{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
.mark svg{display:block}
.logo b{font-size:16px; font-weight:640; letter-spacing:-.012em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seg{display:flex; background:var(--sunken); border-radius:10px; padding:3px; gap:2px; flex:none}
.seg button{padding:5px 12px; border-radius:7px; font-size:13px; font-weight:560; color:var(--ink2); transition:.14s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--brand-ink); box-shadow:var(--sh1)}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink2);flex:none}
.icon:hover{background:var(--hover); color:var(--ink)}
:root[data-theme="dark"] .sun{display:none}
:root:not([data-theme="dark"]) .moon{display:none}

/* ---------- notice ---------- */
.notice{
  margin:18px auto 0; padding:13px 15px; border-radius:var(--r2);
  background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--warn);
  font-size:13.5px; line-height:1.6; display:flex; gap:11px; align-items:flex-start;
}
.notice.hide{display:none}
.notice p{margin:0}
.notice b{font-weight:640}
.notice .x{margin-left:auto;flex:none;color:inherit;opacity:.6;font-size:18px;line-height:1;padding:0 2px}
.notice .x:hover{opacity:1}

/* ---------- toolbar ---------- */
.tools{padding:20px 0 0}
.searchbar{position:relative; display:flex; gap:10px}
.sbox{position:relative; flex:1}
.sbox input{
  width:100%; padding:12px 38px 12px 42px; font-size:15.5px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); box-shadow:var(--sh1);
  transition:border-color .14s, box-shadow .14s;
}
.sbox input::placeholder{color:var(--ink3)}
.sbox input:focus{outline:none; border-color:var(--brand); box-shadow:var(--ring)}
.sbox .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.sbox .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink3);padding:5px;border-radius:7px;display:none}
.sbox.has .clr{display:block} .sbox .clr:hover{background:var(--hover);color:var(--ink)}
.fbtn{
  display:flex;align-items:center;gap:7px;padding:0 15px;border-radius:12px;flex:none;
  border:1px solid var(--line); background:var(--surface); color:var(--ink2); font-size:14.5px; font-weight:540;
  box-shadow:var(--sh1); transition:.14s;
}
.fbtn:hover{color:var(--ink); border-color:var(--ink3)}
.fbtn[aria-expanded="true"]{background:var(--brand-wash); border-color:var(--brand); color:var(--brand-ink)}
.fbtn .cnt{background:var(--brand); color:#fff; font-size:11.5px; font-weight:700; min-width:18px; height:18px;
  border-radius:9px; display:grid; place-items:center; padding:0 5px}
:root[data-theme="dark"] .fbtn .cnt{color:#16161a}
.fbtn .cnt:empty{display:none}

/* ---------- filter panel ---------- */
.panel{
  margin-top:12px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  box-shadow:var(--sh2); padding:18px 18px 6px; display:none;
}
.panel.open{display:block}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:18px 24px}
.fg h3{margin:0 0 9px; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--bg);
  font-size:13px; color:var(--ink2); transition:.13s; line-height:1.4;
}
.chip:hover{border-color:var(--brand); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:560}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#16161a}
.secwrap{grid-column:1/-1}
.seclist{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:2px; max-height:220px; overflow-y:auto; padding-right:4px}
.seclist button{
  text-align:left; padding:6px 9px; border-radius:var(--r3); font-size:13.5px; color:var(--ink2);
  display:flex; gap:8px; align-items:baseline; line-height:1.4;
}
.seclist button:hover{background:var(--hover); color:var(--ink)}
.seclist button[aria-pressed="true"]{background:var(--brand-wash); color:var(--brand-ink); font-weight:560}
.seclist .n{flex:none;font-variant-numeric:tabular-nums;color:var(--ink3);font-size:11.5px;min-width:16px}
.seclist .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seclist .zh{flex:none;font-size:9.5px;padding:0 4px;border-radius:4px;background:var(--sunken);color:var(--ink3)}
.seclist .c{margin-left:auto;flex:none;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.prow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line2);margin-top:16px;padding:12px 0}
.sw{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.sw input{accent-color:var(--brand);width:15px;height:15px;margin:0;flex:none}
.clear{margin-left:auto;font-size:13.5px;color:var(--brand);font-weight:540}

/* ---------- meta strip ---------- */
.strip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 4px;font-size:13.5px;color:var(--ink3)}
.strip b{color:var(--ink);font-weight:640;font-variant-numeric:tabular-nums}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px}
.bar{width:76px;height:5px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}

/* ---------- section heading ---------- */
.sec{
  position:sticky; top:58px; z-index:20; margin:26px 0 12px;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(8px); padding:8px 0 7px; border-bottom:1px solid var(--line2);
}
.sec:first-child{margin-top:12px}
.sec h2{margin:0;font-size:15px;font-weight:640;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.sec .num{
  font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:var(--brand-ink);
  background:var(--brand-wash);padding:2px 7px;border-radius:6px;flex:none;
}
.sec .zhtag{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn);
  border:1px solid var(--warn-line);font-weight:600;flex:none}
.sec .introbtn{margin-left:auto;flex:none;font-size:12px;color:var(--ink3);padding:3px 8px;border-radius:6px}
.sec .introbtn:hover{background:var(--hover);color:var(--ink2)}
.intro{
  font-size:13.5px;color:var(--ink2);line-height:1.68;padding:12px 14px;margin:0 0 12px;
  background:var(--sunken);border-radius:var(--r2);display:none;
}
.intro.open{display:block}
.intro p{margin:0 0 7px} .intro p:last-child{margin:0}

/* ---------- entry card ---------- */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 18px; margin-bottom:10px; scroll-margin-top:118px; transition:border-color .15s, box-shadow .15s;
}
.card:hover{border-color:var(--ink3)}
.card.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%,20%{border-color:var(--brand);box-shadow:var(--ring)}100%{}}
.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.id{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink3);letter-spacing:.01em}
.dot{width:3px;height:3px;border-radius:50%;background:var(--line);flex:none}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:650;white-space:nowrap;letter-spacing:.01em}
.pill.A{background:var(--gA-bg);color:var(--gA)} .pill.B{background:var(--gB-bg);color:var(--gB)} .pill.C{background:var(--gC-bg);color:var(--gC)}
.pill.v3{background:var(--v3-bg);color:var(--v3)} .pill.v2{background:var(--v2-bg);color:var(--v2)} .pill.v1{background:var(--v1-bg);color:var(--v1)}
.pill.dis{background:var(--warn-bg);color:var(--warn)}
h4.t{margin:0 0 9px;font-size:16.5px;font-weight:620;line-height:1.45;letter-spacing:-.008em}
.plain{margin:0;font-size:15.5px;line-height:1.72;color:var(--ink)}
.foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:11.5px;color:var(--ink3);background:var(--sunken);padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.lens{background:var(--brand-wash);color:var(--brand-ink);font-weight:560}
.exp{
  margin-left:auto;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink2);
  padding:4px 10px;border-radius:999px;border:1px solid var(--line);transition:.14s;white-space:nowrap;
}
.exp:hover{background:var(--hover);color:var(--ink);border-color:var(--ink3)}
.exp svg{transition:transform .2s}
.card.open .exp svg{transform:rotate(180deg)}
.detail{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.card.open .detail{display:block}
.row{display:grid;grid-template-columns:92px 1fr;gap:12px;margin-bottom:11px;font-size:14px;line-height:1.7}
.row:last-child{margin-bottom:0}
@media (max-width:560px){ .row{grid-template-columns:1fr;gap:3px} }
.row dt{color:var(--ink3);font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding-top:4px}
.row dd{margin:0;min-width:0;overflow-wrap:anywhere;color:var(--ink2)}
.row.src dd{font-size:12.5px;line-height:1.6;color:var(--ink3)}
.row.src dd div{margin-bottom:4px}
.zhbtn{margin-top:13px;font-size:12.5px;color:var(--ink3);padding:5px 11px;border-radius:999px;border:1px solid var(--line)}
.zhbtn:hover{background:var(--hover);color:var(--ink2)}
.orig{margin-top:12px;padding:13px 15px;border-radius:var(--r2);background:var(--sunken);border:1px solid var(--line2)}
.orig h5{margin:0 0 9px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.orig .ot{font-size:14.5px;font-weight:600;margin:0 0 9px;line-height:1.55}
.ref{color:var(--brand);border-bottom:1px dashed currentColor;cursor:pointer;font-variant-numeric:tabular-nums}
.ref:hover{background:var(--brand-wash)}

.empty{text-align:center;padding:64px 20px;color:var(--ink3)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:7px;font-weight:620}
.load{text-align:center;padding:64px 20px;color:var(--ink3);font-size:14px}
.spin{width:24px;height:24px;border:2.5px solid var(--sunken);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.up{position:fixed;right:22px;bottom:22px;width:42px;height:42px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--sh2);display:grid;place-items:center;color:var(--ink2);
  opacity:0;pointer-events:none;transition:.2s;z-index:40}
.up.on{opacity:1;pointer-events:auto}
.up:hover{color:var(--brand);border-color:var(--brand)}
footer{margin-top:40px;border-top:1px solid var(--line);padding:24px 0 48px;color:var(--ink3);font-size:13px;line-height:1.7}
footer a{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line)}
footer a:hover{color:var(--brand)}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<header>
  <div class="wrap hrow">
    <div class="logo">
      <span class="mark"><svg width="15" height="15" viewBox="0 0 64 64"><path d="M17 33l10 11 20-24" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <b id="brand">A Cost-Effective Life</b>
    </div>
    <div class="seg" role="group" id="langSeg">
      <button data-lang="zh" aria-pressed="false">中文</button>
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="vi" aria-pressed="false">VI</button>
    </div>
    <button class="icon" id="themeBtn" aria-label="Toggle theme">
      <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="notice" id="notice">
    <svg style="flex:none;margin-top:2px" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9.5"/></svg>
    <p id="noticeText"></p>
    <button class="x" id="noticeX" aria-label="Dismiss">&times;</button>
  </div>

  <div class="tools">
    <div class="searchbar">
      <div class="sbox" id="sbox">
        <svg class="mag" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false">
        <button class="clr" id="qClear" aria-label="Clear">&times;</button>
      </div>
      <button class="fbtn" id="fbtn" aria-expanded="false">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
        <span id="fbtnLabel">Filters</span><span class="cnt" id="fcnt"></span>
      </button>
    </div>
    <div class="panel" id="panel"></div>
  </div>

  <div class="strip" id="strip"></div>
  <main id="results"><div class="load"><div class="spin"></div><span id="loadText">Loading…</span></div></main>
  <footer id="footer"></footer>
</div>

<button class="up" id="up" aria-label="Back to top">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
'use strict';
/* ============================================================
   Unofficial English / Vietnamese reader for 高性价比人生指南.

   The Chinese text in ../book/ is authoritative. This page reads it rather than
   replacing it, and every translated entry can show its Chinese original.

   COST_W and gradeRatio are copied from ../index.html on purpose. If the main
   page changes how it grades value for money, change it here too or the two
   pages will disagree about the same entry.
   ============================================================ */
const LANGS = ['zh','en','vi'];
const HTML_LANG = { zh:'zh-CN', en:'en', vi:'vi' };

const COST_W = { money:{'0':0,'少':1,'多':2}, time:{'少':0,'中':1,'多':2}, will:{'否':0,'些':1,'是':2} };
const gradeRatio = (level, cs) =>
  level === '大' ? (cs === 0 ? '极高' : (cs <= 2 ? '高' : '一般'))
: level === '中' ? (cs === 0 ? '高' : '一般') : '一般';

const LABELS = {
  zh:{cost:'成本',human:'说人话',gain:'收益',grade:'证据等级',src:'来源',note:'备注'},
  en:{cost:'Cost',human:'In plain words',gain:'Benefit',grade:'Evidence',src:'Sources',note:'Notes'},
  vi:{cost:'Chi phí',human:'Nói đơn giản',gain:'Lợi ích',grade:'Mức bằng chứng',src:'Nguồn',note:'Ghi chú'},
};
const DISPUTED = { zh:/^争议/, en:/^Disputed/i, vi:/^Có tranh cãi/i };

const TAG = {
  money:{'0':{zh:'不花钱',en:'Free',vi:'Không tốn tiền'},'少':{zh:'花钱少',en:'Low cost',vi:'Tốn ít tiền'},'多':{zh:'花钱多',en:'Costly',vi:'Tốn nhiều tiền'}},
  time:{'少':{zh:'省时间',en:'Minutes',vi:'Vài phút'},'中':{zh:'花些时间',en:'Hours',vi:'Vài giờ'},'多':{zh:'很花时间',en:'Ongoing',vi:'Liên tục'}},
  will:{'否':{zh:'不费毅力',en:'No willpower',vi:'Không cần nghị lực'},'些':{zh:'要些毅力',en:'Some willpower',vi:'Cần ít nghị lực'},'是':{zh:'很费毅力',en:'Sustained effort',vi:'Cần nhiều nghị lực'}},

const t = k => UI[state.lang][k];

const DIMS = ['grade','ratio','lens','money','time','will'];
const state = { lang:'en', q:'', sec:new Set(), showUn:false,
  grade:new Set(), ratio:new Set(), lens:new Set(), money:new Set(), time:new Set(), will:new Set() };
let MANIFEST = null;
const CORPUS = {}, FETCHED = {};
const openCards = new Set();   // which entries the reader expanded, kept across re-renders

/* ---------- parse ---------- */
function parseSection(md, lang, num){
  const L = LABELS[lang];
  const out = { n:num, title:'', intro:[], entries:[], lang };
  let e = null;
  const flush = () => { if (e) out.entries.push(e); e = null; };
  const esc2 = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const field = (k, line) => {
    const m = new RegExp('^- '+esc2(L[k])+'\\s*[：:]\\s*(.*)$').exec(line);
    return m ? m[1].trim() : null;
  };
  for (const raw of md.replace(/\r\n/g,'\n').split('\n')){
    const line = raw.trimEnd(); let m, v;
    if ((m = /^#\s+(\d+)\.\s*(.+)$/.exec(line))){ out.title = m[2].trim(); continue; }
    if ((m = /^###\s+(\d+)\.\s*(.+)$/.exec(line))){
      flush();
      e = { sec:num, n:m[1], title:m[2].trim(), cost:'',human:'',gain:'',grade:'',src:'',note:'',
            money:'',time:'',will:'',level:'',lens:'' };
      continue;
    }
    if ((m = /^<!--\s*成本标签:\s*(.*?)\s*-->/.exec(line)) && e){
      for (const kv of m[1].split(/\s+/)){
        const [k,val] = kv.split('=');
        if (k==='钱') e.money=val; else if (k==='时间') e.time=val; else if (k==='毅力') e.will=val;
        else if (k==='收益') e.level=val; else if (k==='口径') e.lens=val;
      }
      continue;
    }
    if (e){
      let hit = false;
      for (const k of ['cost','human','gain','src','note']){
        if ((v = field(k,line)) !== null){ e[k] = v; hit = true; break; }
      }
      if (!hit && (v = field('grade',line)) !== null){
        const g = /([ABC])/.exec(v); if (g) e.grade = g[1];
        e.gradeRaw = v;
      }
      continue;
    }
    if (line && !/^\[←/.test(line)) out.intro.push(line);
  }
  flush();
  for (const x of out.entries){
    x.cs = (COST_W.money[x.money]??0) + (COST_W.time[x.time]??0) + (COST_W.will[x.will]??0);
    x.ratio = gradeRatio(x.level, x.cs);
    x.disputed = DISPUTED[lang].test(x.note) || /（争议）|\(disputed\)|\(có tranh cãi\)/i.test(x.gradeRaw||'');
    x.hay = [x.title,x.human,x.cost,x.gain,x.note,x.src].join('\n').replace(/\*\*/g,'').toLowerCase();
    x.key = x.sec+'-'+x.n;
  }
  return out;
}

/* ---------- load ---------- */
const getText = async p => { const r = await fetch(p,{cache:'no-cache'}); if(!r.ok) throw new Error(p+' → '+r.status); return r.text(); };
const pathFor = (lang,sec) => lang==='zh' ? '../'+MANIFEST.sections[sec] : `${lang}/book/${sec}.md`;
const effLang = (lang,sec) => lang==='zh' ? 'zh' : (MANIFEST[lang].includes(sec) ? lang : 'zh');
function loadSection(lang,sec){
  const k = lang+sec;
  if (!FETCHED[k]) FETCHED[k] = getText(pathFor(lang,sec))
    .then(md => { (CORPUS[lang] ||= {})[sec] = parseSection(md,lang,sec); })
    .catch(err => console.warn('section failed',lang,sec,err.message));
  return FETCHED[k];
}
const visibleSections = () => state.lang==='zh' ? MANIFEST.zh
  : (state.showUn ? MANIFEST.zh : MANIFEST.zh.filter(s => MANIFEST[state.lang].includes(s)));
const ensureLoaded = () => Promise.all(visibleSections().map(s => loadSection(effLang(state.lang,s), s)));
const sectionFor = sec => CORPUS[effLang(state.lang,sec)]?.[sec];
function allEntries(){
  const rows = [];
  for (const sec of visibleSections()){ const s = sectionFor(sec); if (s) rows.push(...s.entries); }
  return rows;
}

/* ---------- inline markdown ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function inline(src){
  let s = esc(src);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(_,x,u)=>`<a href="${u}" target="_blank" rel="noopener">${x}</a>`);
  s = s.replace(/&lt;(https?:\/\/[^&\s]+?)&gt;/g,(_,u)=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  s = s.replace(/(^|[\s(（])(https?:\/\/[^\s<)），。；]+)/g,(_,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
const pad = s => String(s).padStart(2,'0');
function linkRefs(html, cur){
  html = html.replace(/§\s*(\d{1,2})\.(\d{1,3})/g,(m,s,n)=>`<a class="ref" data-go="${pad(s)}-${n}">§${pad(s)}.${n}</a>`);
  html = html.replace(/第\s*(\d{1,2})\s*节第\s*(\d{1,3})\s*条/g,(m,s,n)=>`<a class="ref" data-go="${pad(s)}-${n}">${m}</a>`);
  if (cur) html = html.replace(/(^|[^节])第\s*(\d{1,3})\s*条/g,(m,p,n)=>`${p}<a class="ref" data-go="${cur}-${n}">第 ${n} 条</a>`);
  return html;
}
const srcHtml = s => s.split(/；/).map(p=>p.trim()).filter(Boolean).map(p=>`<div>${inline(p)}</div>`).join('');

/* ---------- filter ---------- */
function matches(e){
  if (state.sec.size && !state.sec.has(e.sec)) return false;
  for (const d of DIMS) if (state[d].size && !state[d].has(e[d])) return false;
  if (state.q) return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => e.hay.includes(w));
  return true;
}
const activeCount = () => state.sec.size + DIMS.reduce((n,d)=>n+state[d].size,0) + (state.showUn?1:0);

/* ---------- render a card ---------- */
const CHEV = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

function card(e){
  const L = LABELS[e.lang || state.lang];
  const el = document.createElement('article');
  el.className = 'card' + (openCards.has(e.key) ? ' open' : '');
  el.id = 'e-'+e.key;

  const pills = [];
  if (e.grade) pills.push(`<span class="pill ${e.grade}">${e.grade}</span>`);
  if (e.ratio) pills.push(`<span class="pill v${({'极高':3,'高':2,'一般':1})[e.ratio]}">${esc(tagText('ratio',e.ratio))}</span>`);
  if (e.disputed) pills.push(`<span class="pill dis">${state.lang==='zh'?'争议':state.lang==='vi'?'tranh cãi':'disputed'}</span>`);

  const tags = [];
  if (e.lens) tags.push(`<span class="tag lens">${esc(tagText('lens',e.lens))}</span>`);
  for (const d of ['money','time','will']) if (e[d]) tags.push(`<span class="tag">${esc(tagText(d,e[d]))}</span>`);

  const rows = [];
  const row = (cls,dt,dd) => `<div class="row ${cls}"><dt>${esc(dt)}</dt><dd>${dd}</dd></div>`;
  if (e.cost) rows.push(row('',L.cost,linkRefs(inline(e.cost),e.sec)));
  if (e.gain) rows.push(row('',L.gain,linkRefs(inline(e.gain),e.sec)));
  if (e.note) rows.push(row('',L.note,linkRefs(inline(e.note),e.sec)));
  if (e.src)  rows.push(row('src',L.src,srcHtml(e.src)));

  el.innerHTML =
    `<div class="top"><span class="id">§${e.sec}.${e.n}</span><span class="dot"></span>${pills.join('')}</div>`+
    `<h4 class="t">${linkRefs(inline(e.title),e.sec)}</h4>`+
    (e.human ? `<p class="plain">${linkRefs(inline(e.human),e.sec)}</p>` : '')+
    `<div class="foot">${tags.join('')}`+
      `<button class="exp" data-exp="${e.key}"><span>${esc(openCards.has(e.key)?t('less'):t('more'))}</span>${CHEV}</button>`+
    `</div>`+
    `<div class="detail"><dl style="margin:0">${rows.join('')}</dl>`+
      (e.lang !== 'zh' ? `<button class="zhbtn" data-zh="${e.key}">${esc(t('showZh'))}</button>` : '')+
    `</div>`;
  return el;
}

/* ---------- render ---------- */
function render(){
  const box = document.getElementById('results');
  const rows = allEntries(), hits = rows.filter(matches);

  const done = state.lang==='zh' ? MANIFEST.zh.length : MANIFEST[state.lang].length;
  const total = MANIFEST.zh.length;
  document.getElementById('strip').innerHTML =
    `<span>${t('count')(hits.length,rows.length)}</span>`+
    (state.lang==='zh' ? '' :
      `<span class="prog"><span>${esc(t('prog')(done,total))}</span><span class="bar"><i style="width:${Math.round(done/total*100)}%"></i></span></span>`);

  const n = activeCount();
  document.getElementById('fcnt').textContent = n ? n : '';

  if (!hits.length){
    box.innerHTML = `<div class="empty"><b>${esc(t('none'))}</b>${esc(t('noneHint'))}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  let cur = null;
  for (const e of hits){
    if (e.sec !== cur){
      cur = e.sec;
      const s = sectionFor(cur), zhFallback = state.lang!=='zh' && e.lang==='zh';
      const head = document.createElement('div');
      head.className = 'sec'; head.id = 'sec-'+cur;
      head.innerHTML = `<h2><span class="num">${cur}</span><span>${esc(s?.title||'')}</span>`+
        (zhFallback ? `<span class="zhtag">${esc(t('untrans'))}</span>` : '')+
        (s?.intro?.length ? `<button class="introbtn" data-intro="${cur}">${esc(t('intro'))}</button>` : '')+
        `</h2>`;
      frag.appendChild(head);
      if (s?.intro?.length){
        const ip = document.createElement('div');
        ip.className = 'intro'; ip.id = 'intro-'+cur;
        ip.innerHTML = s.intro.map(p=>`<p>${linkRefs(inline(p),cur)}</p>`).join('');
        frag.appendChild(ip);
      }
    }
    frag.appendChild(card(e));
  }
  box.replaceChildren(frag);
}

/* ---------- filter panel ---------- */
const chipRow = (dim,vals) => `<div class="chips">`+vals.map(v =>
  `<button class="chip" data-dim="${dim}" data-val="${esc(v)}" aria-pressed="${state[dim].has(v)}">${esc(dim==='grade'?v:tagText(dim,v))}</button>`
).join('')+`</div>`;

function renderPanel(){
  const counts = {};
  for (const e of allEntries()) counts[e.sec] = (counts[e.sec]||0)+1;
  document.getElementById('panel').innerHTML = `
    <div class="grid">
      <div class="fg"><h3>${esc(t('fGrade'))}</h3>${chipRow('grade',['A','B','C'])}</div>
      <div class="fg"><h3>${esc(t('fRatio'))}</h3>${chipRow('ratio',['极高','高','一般'])}</div>
      <div class="fg"><h3>${esc(t('fLens'))}</h3>${chipRow('lens',['死亡率','金钱','时间','自由'])}</div>
      <div class="fg"><h3>${esc(t('fMoney'))}</h3>${chipRow('money',['0','少','多'])}</div>
      <div class="fg"><h3>${esc(t('fTime'))}</h3>${chipRow('time',['少','中','多'])}</div>
      <div class="fg"><h3>${esc(t('fWill'))}</h3>${chipRow('will',['否','些','是'])}</div>
      <div class="fg secwrap"><h3>${esc(t('fSec'))}</h3>
        <div class="seclist">${visibleSections().map(s=>{
          const sec = sectionFor(s), zh = state.lang!=='zh' && !MANIFEST[state.lang].includes(s);
          return `<button data-dim="sec" data-val="${s}" aria-pressed="${state.sec.has(s)}">
            <span class="n">${s}</span><span class="t">${esc(sec?.title||'…')}</span>
            ${zh?'<span class="zh">中</span>':''}<span class="c">${counts[s]??0}</span></button>`;
        }).join('')}</div>
      </div>
    </div>
    <div class="prow">
      ${state.lang==='zh' ? '' : `<label class="sw"><input type="checkbox" id="showUn" ${state.showUn?'checked':''}><span>${esc(t('showUn'))}</span></label>`}
      <button class="clear" id="clearAll">${esc(t('clear'))}</button>
    </div>`;
}

/* ---------- chrome ---------- */
function applyLang(){
  document.documentElement.lang = HTML_LANG[state.lang];
  document.getElementById('brand').textContent = t('title');
  document.getElementById('q').placeholder = t('search');
  document.getElementById('noticeText').innerHTML = t('notice');
  document.getElementById('fbtnLabel').textContent = t('filters');
  document.getElementById('footer').innerHTML = t('footer');
  // Only exists until the first render replaces #results.
  const l = document.getElementById('loadText'); if (l) l.textContent = t('loading');
  for (const b of document.querySelectorAll('#langSeg button'))
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
}

/* ---------- url ---------- */
function writeUrl(){
  const p = new URLSearchParams();
  if (state.lang!=='en') p.set('lang',state.lang);
  if (state.q) p.set('q',state.q);
  if (state.sec.size) p.set('sec',[...state.sec].join(','));
  for (const d of DIMS) if (state[d].size) p.set(d,[...state[d]].join(','));
  if (state.showUn) p.set('all','1');
  const qs = p.toString();
  history.replaceState(null,'',qs?'?'+qs:location.pathname);
}
function readUrl(){
  const p = new URLSearchParams(location.search);
  if (LANGS.includes(p.get('lang'))) state.lang = p.get('lang');
  state.q = p.get('q')||'';
  state.sec = new Set((p.get('sec')||'').split(',').filter(Boolean));
  for (const d of DIMS) state[d] = new Set((p.get(d)||'').split(',').filter(Boolean));
  state.showUn = p.get('all')==='1';
}

let busy = false;
async function refresh({panel=true}={}){
  if (busy) return; busy = true;
  try { await ensureLoaded(); if (panel) renderPanel(); render(); writeUrl(); }
  finally { busy = false; }
}

async function goTo(key){
  const [sec] = key.split('-');
  if (!MANIFEST.zh.includes(sec)) return;
  if (state.lang!=='zh' && !MANIFEST[state.lang].includes(sec) && !state.showUn) state.showUn = true;
  if (state.sec.size && !state.sec.has(sec)) state.sec = new Set();
  await refresh();
  let el = document.getElementById('e-'+key);
  if (!el){
    state.q=''; document.getElementById('q').value=''; document.getElementById('sbox').classList.remove('has');
    for (const d of DIMS) state[d] = new Set();
    await refresh();
    el = document.getElementById('e-'+key);
  }
  if (el){
    openCards.add(key); el.classList.add('open');
    el.scrollIntoView({behavior:'smooth',block:'start'});
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
}

async function toggleZh(key, btn){
  const c = document.getElementById('e-'+key); if (!c) return;
  const open = c.querySelector('.orig');
  if (open){ open.remove(); btn.textContent = t('showZh'); return; }
  const [sec,n] = key.split('-');
  await loadSection('zh',sec);
  const z = CORPUS.zh?.[sec]?.entries.find(x=>x.n===n);
  if (!z){ btn.textContent = t('notLoaded'); return; }
  const L = LABELS.zh, row = (dt,dd)=>`<div class="row"><dt>${esc(dt)}</dt><dd>${dd}</dd></div>`;
  const b = document.createElement('div');
  b.className = 'orig';
  b.innerHTML = `<h5>${esc(t('zhHead'))}</h5><p class="ot">${inline(z.title)}</p><dl style="margin:0">`+
    (z.human?row(L.human,inline(z.human)):'')+(z.cost?row(L.cost,inline(z.cost)):'')+
    (z.gain?row(L.gain,inline(z.gain)):'')+(z.note?row(L.note,inline(z.note)):'')+`</dl>`;
  c.querySelector('.detail').appendChild(b);
  btn.textContent = t('hideZh');
}

/* ---------- events ---------- */
function wire(){
  const q = document.getElementById('q'), sbox = document.getElementById('sbox');

  document.getElementById('langSeg').addEventListener('click', async ev => {
    const b = ev.target.closest('button[data-lang]');
    if (!b || b.dataset.lang === state.lang) return;
    state.lang = b.dataset.lang; applyLang(); await refresh();
  });
  document.getElementById('themeBtn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('hltb-i18n-theme', dark?'light':'dark'); } catch(e){}
  });
  document.getElementById('noticeX').addEventListener('click', () => {
    document.getElementById('notice').classList.add('hide');
    try { localStorage.setItem('hltb-i18n-notice','off'); } catch(e){}
  });
  try { if (localStorage.getItem('hltb-i18n-notice')==='off') document.getElementById('notice').classList.add('hide'); } catch(e){}

  let timer = null;
  q.addEventListener('input', () => {
    sbox.classList.toggle('has', !!q.value);
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = q.value.trim(); render(); writeUrl(); }, 140);
  });
  document.getElementById('qClear').addEventListener('click', () => {
    q.value=''; state.q=''; sbox.classList.remove('has'); render(); writeUrl(); q.focus();
  });

  const fbtn = document.getElementById('fbtn'), panel = document.getElementById('panel');
  fbtn.addEventListener('click', () => {
    const open = panel.classList.toggle('open');
    fbtn.setAttribute('aria-expanded', String(open));
  });

  panel.addEventListener('click', ev => {
    const chip = ev.target.closest('[data-dim]');
    if (chip){
      const {dim,val} = chip.dataset;
      state[dim].has(val) ? state[dim].delete(val) : state[dim].add(val);
      renderPanel(); render(); writeUrl(); return;
    }
    if (ev.target.closest('#clearAll')){
      state.q=''; q.value=''; sbox.classList.remove('has'); state.sec = new Set();
      for (const d of DIMS) state[d] = new Set();
      renderPanel(); render(); writeUrl();
    }
  });
  panel.addEventListener('change', async ev => {
    if (ev.target.id === 'showUn'){ state.showUn = ev.target.checked; await refresh(); }
  });

  document.getElementById('results').addEventListener('click', ev => {
    const ref = ev.target.closest('.ref[data-go]');
    if (ref){ ev.preventDefault(); goTo(ref.dataset.go); return; }
    const ex = ev.target.closest('[data-exp]');
    if (ex){
      const key = ex.dataset.exp, c = document.getElementById('e-'+key);
      const nowOpen = c.classList.toggle('open');
      nowOpen ? openCards.add(key) : openCards.delete(key);
      ex.querySelector('span').textContent = nowOpen ? t('less') : t('more');
      return;
    }
    const zb = ev.target.closest('[data-zh]');
    if (zb){ toggleZh(zb.dataset.zh, zb); return; }
    const ib = ev.target.closest('[data-intro]');
    if (ib){ document.getElementById('intro-'+ib.dataset.intro)?.classList.toggle('open'); }
  });

  document.addEventListener('keydown', ev => {
    if (ev.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){ ev.preventDefault(); q.focus(); }
    else if (ev.key === 'Escape' && document.activeElement === q){
      q.value=''; state.q=''; sbox.classList.remove('has'); render(); writeUrl();
    }
  });

  const up = document.getElementById('up');
  up.addEventListener('click', () => scrollTo({top:0,behavior:'smooth'}));
  addEventListener('scroll', () => up.classList.toggle('on', scrollY > 700), {passive:true});
}

/* ---------- boot ---------- */
(async function init(){
  readUrl(); wire(); applyLang();
  const q = document.getElementById('q');
  q.value = state.q;
  if (state.q) document.getElementById('sbox').classList.add('has');
  try { MANIFEST = await (await fetch('manifest.json',{cache:'no-cache'})).json(); }
  catch(err){
    document.getElementById('results').innerHTML =
      `<div class="empty"><b>${esc(t('failed'))}</b>${esc(t('failedHint'))}</div>`;
    return;
  }
  if (state.lang!=='zh' && !MANIFEST[state.lang].length) state.showUn = true;
  await refresh();
})();
</script>
</body>
