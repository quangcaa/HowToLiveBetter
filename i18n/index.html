<style>
:root{
  --nav-h:64px; --side-w:272px; --head:64px;
  --bg:#ffffff; --bg-alt:#f6f6f7; --bg-soft:#f6f6f7; --bg-mute:#f1f1f2; --bg-elv:#ffffff;
  --divider:#e2e2e3; --t1:rgba(60,60,67,1); --t2:rgba(60,60,67,.78); --t3:rgba(60,60,67,.56);
  --brand-1:#3451b2; --brand-2:#3a5ccc; --brand-3:#5672cd; --brand-soft:rgba(100,108,255,.14);
  --green-1:#18794e; --green-soft:rgba(16,185,129,.14);
  --yellow-1:#915930; --yellow-soft:rgba(234,179,8,.14);
  --red-1:#b8272c; --red-soft:rgba(244,63,94,.14);
  --gray-1:#565a5f; --gray-soft:rgba(142,150,170,.14);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1b1b1f; --bg-alt:#161618; --bg-soft:#202127; --bg-mute:#2b2b2f; --bg-elv:#202127;
  --divider:#2e2e32; --t1:rgba(255,255,245,.86); --t2:rgba(235,235,245,.6); --t3:rgba(235,235,245,.38);
  --brand-1:#a8b1ff; --brand-2:#5c73e7; --brand-3:#3e63dd; --brand-soft:rgba(100,108,255,.16);
  --green-1:#3dd68c; --green-soft:rgba(16,185,129,.16);
  --yellow-1:#f9b44e; --yellow-soft:rgba(234,179,8,.16);
  --red-1:#f66f81; --red-soft:rgba(244,63,94,.16);
  --gray-1:#a4a8ae; --gray-soft:rgba(142,150,170,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.7 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--brand-1);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brand-1);outline-offset:2px}
[hidden]{display:none!important}

.nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:30;background:var(--bg);border-bottom:1px solid var(--divider)}
.nav-in{height:100%;display:flex;align-items:center;gap:16px;padding:0 24px}
.title{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:var(--t1);white-space:nowrap;text-decoration:none;min-width:0}
.title:hover{text-decoration:none;color:var(--t1)}
.logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--brand-3),var(--brand-1));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:15px;height:15px}
.title span:last-child{overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;height:40px;padding:0 16px 0 40px;border-radius:8px;border:1px solid transparent;background:var(--bg-alt);color:var(--t1);font:inherit;font-size:14px}
.search input:hover{border-color:var(--divider)}
.search input:focus{outline:0;border-color:var(--brand-1);background:var(--bg)}
.search input::placeholder{color:var(--t3)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--t3);stroke-width:2;pointer-events:none}
.nav-r{display:flex;align-items:center;gap:8px}
.langs{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--divider);border-radius:10px;background:var(--bg-alt);flex:none}
.langs button{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--t2);white-space:nowrap}
.langs button:hover{color:var(--t1);background:var(--bg-mute)}
.langs button[aria-pressed="true"]{background:var(--brand-1);color:#fff}
:root[data-theme="dark"] .langs button[aria-pressed="true"]{color:#1b1b1f}
.langs .short{display:none}
.icon-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--t2)}
.icon-btn:hover{background:var(--bg-soft);color:var(--t1)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.menu-btn{display:none}
.switch{position:relative;width:40px;height:22px;border-radius:11px;border:1px solid var(--divider);background:var(--bg-mute);flex:none;margin-left:8px}
.switch .knob{position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:var(--bg-elv);box-shadow:var(--shadow);transition:transform .25s;display:grid;place-items:center}
:root[data-theme="dark"] .switch .knob{transform:translateX(18px)}
.switch svg{width:12px;height:12px;fill:var(--t2)}
.switch .sun{display:block}.switch .moon{display:none}
:root[data-theme="dark"] .switch .sun{display:none}
:root[data-theme="dark"] .switch .moon{display:block}

.sidebar{position:fixed;top:var(--nav-h);bottom:0;left:0;width:var(--side-w);background:var(--bg-alt);padding:32px 24px 96px;overflow-y:auto;z-index:20}
.backdrop{display:none}
.content{padding:calc(var(--nav-h) + 40px) 48px 80px calc(var(--side-w) + 48px)}
.doc{max-width:900px;margin:0 auto}
.group{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--divider)}
.group:last-child{border-bottom:0}
.gt{font-size:14px;font-weight:700;color:var(--t1);line-height:24px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.chip{border:1px solid var(--divider);background:var(--bg-elv);color:var(--t2);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:500;line-height:18px}
.chip:hover{border-color:var(--brand-3);color:var(--t1)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand-1);color:var(--brand-1)}
.sec-links{display:flex;flex-direction:column}
.sec-link{display:flex;align-items:flex-start;gap:8px;width:100%;padding:4px 0;font-size:14px;font-weight:500;color:var(--t2);line-height:24px;text-align:left}
.sec-link>span{flex:1;min-width:0}
.sec-link i{font-style:normal;margin-left:auto;font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.sec-link[aria-pressed="true"]{color:var(--brand-1)}
.sw{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--t2);padding:4px 0;cursor:pointer}
.sw input{accent-color:var(--brand-1);width:15px;height:15px;margin:4px 0 0;flex:none}
.clear{display:inline-flex;margin-top:8px;padding:6px 14px;border:1px solid var(--divider);border-radius:20px;font-size:13px;font-weight:500;color:var(--t2);background:var(--bg-elv)}
.clear:hover{border-color:var(--brand-1);color:var(--brand-1)}

.notice{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;padding:10px 14px;border:1px solid var(--divider);border-radius:8px;background:var(--bg-alt);color:var(--t2);font-size:13.5px;line-height:1.55}
.notice.hide{display:none}
.notice p{margin:0}
.notice .x{margin-left:auto;flex:none;color:var(--t3);font-size:18px;line-height:1}
.strip{color:var(--t3);font-size:14px;margin:6px 0 8px}
.strip b{color:var(--brand-1);font-weight:600}
.prog{display:flex;align-items:center;gap:8px;margin-top:4px}
.bar{width:74px;height:3px;border-radius:2px;background:var(--bg-mute);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand-1)}
.sec-block{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:12px;padding-top:24px;border-top:1px solid var(--divider);margin-bottom:8px}
.sec-h h2{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.02em;margin:0}
.sec-h .shown{margin-left:auto;font-size:13px;color:var(--t3)}
.intro{margin:0 0 12px;color:var(--t2);font-size:14px}
.intro p{margin:0 0 8px}
.card{background:var(--bg-soft);border:1px solid transparent;border-radius:12px;padding:22px 24px 18px;margin-bottom:16px}
.card:hover{border-color:var(--divider)}
.card.flash{outline:2px solid var(--brand-1)}
.card-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-h h3{margin:0;font-size:18px;line-height:28px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0}
.card-h .idx{color:var(--t3);font-size:14px;line-height:28px;font-variant-numeric:tabular-nums;min-width:22px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.badge{display:inline-block;border-radius:10px;padding:0 10px;line-height:20px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.A{background:var(--green-soft);color:var(--green-1)}
.badge.B{background:var(--yellow-soft);color:var(--yellow-1)}
.badge.C{background:var(--gray-soft);color:var(--gray-1)}
.badge.r3{background:var(--brand-soft);color:var(--brand-1)}
.badge.r2{background:var(--green-soft);color:var(--green-1)}
.badge.r1{background:var(--gray-soft);color:var(--gray-1)}
.badge.plain{background:var(--gray-soft);color:var(--t2);font-weight:500}
.badge.danger{background:var(--red-soft);color:var(--red-1)}
.human{margin:0 0 14px;padding:10px 14px;border-left:2px solid var(--brand-1);background:var(--brand-soft);border-radius:0 6px 6px 0;font-size:15px;line-height:1.75;color:var(--t1)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;line-height:1.75}
.rows .k{color:var(--t3);font-weight:500;font-size:13px}
.rows .v{color:var(--t1);min-width:0;overflow-wrap:anywhere}
.rows .v.note{color:var(--t2)}
.src{margin-top:14px;border-top:1px solid var(--divider);padding-top:10px}
.src summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--t2)}
.src .body{padding-top:8px;font-size:13px;line-height:1.75;color:var(--t2);overflow-wrap:anywhere}
.zhbtn{margin-top:12px;font-size:13px;color:var(--t2);padding:6px 12px;border-radius:20px;border:1px solid var(--divider);background:var(--bg-elv)}
.orig{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--divider)}
.orig h5{margin:0 0 8px;font-size:12px;color:var(--t3)}
.orig .ot{font-weight:600;margin:0 0 8px}
.ref{color:var(--brand-1);border-bottom:1px dashed currentColor;cursor:pointer}
.empty{border:1px dashed var(--divider);border-radius:12px;padding:40px 24px;text-align:center;color:var(--t2)}
.load{color:var(--t3);padding:40px 0;text-align:center}
.spin{width:22px;height:22px;margin:0 auto 10px;border:2px solid var(--bg-mute);border-top-color:var(--brand-1);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--divider);color:var(--t3);font-size:13px;line-height:1.7}
footer a{color:var(--t2)}

@media (max-width:960px){
  :root{--nav-h:56px}
  .nav-in{padding:0 16px;gap:10px}
  .title span:last-child{display:none}
  .search{max-width:none}
  .langs .full{display:none}
  .langs .short{display:inline}
  .langs button{padding:0 8px}
  .menu-btn{display:grid}
  .sidebar{transform:translateX(-100%);transition:transform .25s;padding:20px 16px 96px;left:0;right:0;width:auto;z-index:25}
  .sidebar.open{transform:none}
  html.menu-open,html.menu-open body{overflow:hidden}
  .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15;opacity:0;pointer-events:none}
  .backdrop.on{opacity:1;pointer-events:auto}
  .content{padding:calc(var(--nav-h) + 24px) 20px 80px}
  .sec-h h2{font-size:22px;line-height:30px}
  .card{padding:18px 16px 14px}
  .rows{grid-template-columns:1fr;gap:4px}
}
@media (max-width:520px){
  :root{--nav-h:108px}
  .nav{height:auto}
  .nav-in{height:auto;flex-wrap:wrap;padding:8px 12px 10px;row-gap:8px}
  .title{display:none}
  .search{flex:1 1 100%;order:5;margin-left:0}
  .nav-r{margin-left:auto}
  .sidebar{display:flex;flex-direction:column}
  #rail{display:flex;flex-direction:column;min-height:0}
  #rail .group.secs{order:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
'use strict';
/* ============================================================
   Unofficial English / Vietnamese reader for 高性价比人生指南.
   The Chinese text in ../book/ is authoritative. This page reads it rather than
   replacing it, and every translated entry can show its Chinese original.

   COST_W and gradeRatio are copied from ../index.html on purpose. If the main
   page changes how it grades value for money, change it here too or the two
   pages will disagree about the same entry.
   ============================================================ */
const LANGS = ['zh','en','vi'];
const HTML_LANG = { zh:'zh-CN', en:'en', vi:'vi' };

const COST_W = { money:{'0':0,'少':1,'多':2}, time:{'少':0,'中':1,'多':2}, will:{'否':0,'些':1,'是':2} };
const gradeRatio = (level, cs) =>
  level === '大' ? (cs === 0 ? '极高' : (cs <= 2 ? '高' : '一般'))
: level === '中' ? (cs === 0 ? '高' : '一般') : '一般';

const LABELS = {
  zh:{cost:'成本',human:'说人话',gain:'收益',grade:'证据等级',src:'来源',note:'备注'},

const DISPUTED = { zh:/^争议/, en:/^Disputed/i, vi:/^Có tranh cãi/i };

const TAG = {
  money:{'0':{zh:'不花钱',en:'Free',vi:'Không tốn tiền'},'少':{zh:'花钱少',en:'Low cost',vi:'Tốn ít tiền'},'多':{zh:'花钱多',en:'Costly',vi:'Tốn nhiều tiền'}},

  will:{'否':{zh:'不费毅力',en:'No willpower',vi:'Không cần nghị lực'},'些':{zh:'要些毅力',en:'Some willpower',vi:'Cần ít nghị lực'},'是':{zh:'很费毅力',en:'Sustained effort',vi:'Cần nhiều nghị lực'}},
  level:{'大':{zh:'收益大',en:'Large benefit',vi:'Lợi ích lớn'},'中':{zh:'收益中',en:'Medium benefit',vi:'Lợi ích vừa'},'小':{zh:'收益小',en:'Small benefit',vi:'Lợi ích nhỏ'}},
  lens:{'死亡率':{zh:'换寿命',en:'Lifespan',vi:'Tuổi thọ'},'金钱':{zh:'换钱',en:'Money',vi:'Tiền'},'时间':{zh:'换时间精力',en:'Time & energy',vi:'Thời gian & sức lực'},'自由':{zh:'换人身自由',en:'Freedom',vi:'Tự do'}},
  ratio:{'极高':{zh:'性价比极高',en:'Very high value',vi:'Rất đáng làm'},'高':{zh:'性价比高',en:'High value',vi:'Đáng làm'},'一般':{zh:'性价比一般',en:'Moderate value',vi:'Vừa phải'}},
};
const tagText = (d,v) => TAG[d]?.[v]?.[state.lang] ?? v;

const UI = {
  zh:{
    title:'高性价比人生指南', search:'搜索条目、成本、收益、备注……', filters:'筛选', clear:'清除全部',

const t = k => UI[state.lang][k];

const DIMS = ['grade','ratio','lens','money','time','will'];
const state = { lang:'en', q:'', sec:new Set(), showUn:false,
  grade:new Set(), ratio:new Set(), lens:new Set(), money:new Set(), time:new Set(), will:new Set() };
let MANIFEST = null;
const CORPUS = {}, FETCHED = {};

/* ---------- parse ---------- */
function parseSection(md, lang, num){
  const L = LABELS[lang];
  const out = { n:num, title:'', intro:[], entries:[], lang };
  let e = null;
  const flush = () => { if (e) out.entries.push(e); e = null; };
  const esc2 = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const field = (k,line) => {
    const m = new RegExp('^- '+esc2(L[k])+'\\s*[：:]\\s*(.*)$').exec(line);
    return m ? m[1].trim() : null;
  };
  for (const raw of md.replace(/\r\n/g,'\n').split('\n')){
    const line = raw.trimEnd(); let m, v;
    if ((m = /^#\s+(\d+)\.\s*(.+)$/.exec(line))){ out.title = m[2].trim(); continue; }
    if ((m = /^###\s+(\d+)\.\s*(.+)$/.exec(line))){
      flush();
      e = { sec:num, n:m[1], title:m[2].trim(), cost:'',human:'',gain:'',grade:'',src:'',note:'',
            money:'',time:'',will:'',level:'',lens:'' };
      continue;
    }
    if ((m = /^<!--\s*成本标签:\s*(.*?)\s*-->/.exec(line)) && e){
      for (const kv of m[1].split(/\s+/)){
        const [k,val] = kv.split('=');
        if (k==='钱') e.money=val; else if (k==='时间') e.time=val; else if (k==='毅力') e.will=val;
        else if (k==='收益') e.level=val; else if (k==='口径') e.lens=val;
      }
      continue;
    }
    if (e){
      let hit = false;
      for (const k of ['cost','human','gain','src','note']){
        if ((v = field(k,line)) !== null){ e[k] = v; hit = true; break; }
      }
      if (!hit && (v = field('grade',line)) !== null){
        const g = /([ABC])/.exec(v); if (g) e.grade = g[1];
        e.gradeRaw = v;
      }
      continue;
    }
    if (line && !/^\[←/.test(line)) out.intro.push(line);
  }
  flush();
  for (const x of out.entries){
    x.cs = (COST_W.money[x.money]??0)+(COST_W.time[x.time]??0)+(COST_W.will[x.will]??0);
    x.ratio = gradeRatio(x.level, x.cs);
    x.disputed = DISPUTED[lang].test(x.note) || /（争议）|\(disputed\)|\(có tranh cãi\)/i.test(x.gradeRaw||'');
    x.hay = [x.title,x.human,x.cost,x.gain,x.note,x.src].join('\n').replace(/\*\*/g,'').toLowerCase();
    x.key = x.sec+'-'+x.n;
  }
  return out;
}

/* ---------- load ---------- */
const getText = async p => { const r = await fetch(p,{cache:'no-cache'}); if(!r.ok) throw new Error(p+' → '+r.status); return r.text(); };
const pathFor = (lang,sec) => lang==='zh' ? '../'+MANIFEST.sections[sec] : `${lang}/book/${sec}.md`;
const effLang = (lang,sec) => lang==='zh' ? 'zh' : (MANIFEST[lang].includes(sec) ? lang : 'zh');
function loadSection(lang,sec){
  const k = lang+sec;
  if (!FETCHED[k]) FETCHED[k] = getText(pathFor(lang,sec))
    .then(md => { (CORPUS[lang] ||= {})[sec] = parseSection(md,lang,sec); })
    .catch(err => console.warn('section failed',lang,sec,err.message));
  return FETCHED[k];
}
const visibleSections = () => state.lang==='zh' ? MANIFEST.zh
  : (state.showUn ? MANIFEST.zh : MANIFEST.zh.filter(s => MANIFEST[state.lang].includes(s)));
const ensureLoaded = () => Promise.all(visibleSections().map(s => loadSection(effLang(state.lang,s), s)));
const sectionFor = sec => CORPUS[effLang(state.lang,sec)]?.[sec];
function allEntries(){
  const rows = [];
  for (const sec of visibleSections()){ const s = sectionFor(sec); if (s) rows.push(...s.entries); }
  return rows;
}

/* ---------- inline markdown ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function inline(src){
  let s = esc(src);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(_,x,u)=>`<a href="${u}" target="_blank" rel="noopener">${x}</a>`);
  s = s.replace(/&lt;(https?:\/\/[^&\s]+?)&gt;/g,(_,u)=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  s = s.replace(/(^|[\s(（])(https?:\/\/[^\s<)），。；]+)/g,(_,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
const pad = s => String(s).padStart(2,'0');
function linkRefs(html, cur){
  html = html.replace(/§\s*(\d{1,2})\.(\d{1,3})/g,(m,s,n)=>`<a class="ref" data-go="${pad(s)}-${n}">§${pad(s)}.${n}</a>`);
  html = html.replace(/第\s*(\d{1,2})\s*节第\s*(\d{1,3})\s*条/g,(m,s,n)=>`<a class="ref" data-go="${pad(s)}-${n}">${m}</a>`);
  if (cur) html = html.replace(/(^|[^节])第\s*(\d{1,3})\s*条/g,(m,p,n)=>`${p}<a class="ref" data-go="${cur}-${n}">第 ${n} 条</a>`);
  return html;
}
const srcHtml = s => s.split(/；/).map(p=>p.trim()).filter(Boolean).map(p=>`<div>${inline(p)}</div>`).join('');
function matches(e){
  if (state.sec.size && !state.sec.has(e.sec)) return false;
  for (const d of DIMS) if (state[d].size && !state[d].has(e[d])) return false;
  if (state.q) return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => e.hay.includes(w));
  return true;
}
const activeCount = () => state.sec.size + DIMS.reduce((n,d)=>n+state[d].size,0) + (state.showUn?1:0);

function card(e){
  const L = LABELS[e.lang || state.lang];
  const el = document.createElement('article');
  el.className = 'card';
  el.id = 'e-'+e.key;

  const badges = [];
  const rv = {'极高':'r3','高':'r2','一般':'r1'}[e.ratio];
  if (e.ratio) badges.push(`<span class="badge ${rv}">${esc(tagText('ratio',e.ratio))}</span>`);
  if (e.grade) badges.push(`<span class="badge ${e.grade}">${esc(L.grade)} ${e.grade}</span>`);
  if (e.lens) badges.push(`<span class="badge plain">${esc(tagText('lens',e.lens))}</span>`);
  for (const d of ['money','time','will']) if (e[d]) badges.push(`<span class="badge plain">${esc(tagText(d,e[d]))}</span>`);
  if (e.disputed) badges.push(`<span class="badge danger">${state.lang==='zh'?'争议':state.lang==='vi'?'Có tranh cãi':'Disputed'}</span>`);

  const row = (k,v,cls) => `<div class="k">${esc(k)}</div><div class="v ${cls||''}">${v}</div>`;
  const rows = [];
  if (e.cost) rows.push(row(L.cost, linkRefs(inline(e.cost),e.sec), 'cost'));
  if (e.gain) rows.push(row(L.gain, linkRefs(inline(e.gain),e.sec), 'gain'));
  if (e.note) rows.push(row(L.note, linkRefs(inline(e.note),e.sec), 'note'));

  el.innerHTML =
    `<div class="card-h"><span class="idx">${esc(e.n)}</span><h3>${linkRefs(inline(e.title),e.sec)}</h3></div>`+
    `<div class="badges">${badges.join('')}</div>`+
    (e.human ? `<p class="human">${linkRefs(inline(e.human),e.sec)}</p>` : '')+
    (rows.length ? `<div class="rows">${rows.join('')}</div>` : '')+
    (e.src ? `<details class="src"><summary>${esc(L.src)}</summary><div class="body">${srcHtml(e.src)}</div></details>` : '')+
    (e.lang !== 'zh' ? `<div class="detail"><button class="zhbtn" data-zh="${e.key}">${esc(t('showZh'))}</button></div>` : '');
  return el;
}

/* ---------- render ---------- */
function render(){
  const box = document.getElementById('results');
  const rows = allEntries(), hits = rows.filter(matches);

  const done = state.lang==='zh' ? MANIFEST.zh.length : MANIFEST[state.lang].length;
  const total = MANIFEST.zh.length;
  document.getElementById('strip').innerHTML =
    `<span>${t('count')(hits.length,rows.length)}</span>`+
    (state.lang==='zh' ? '' :
      `<span class="prog"><span>${esc(t('prog')(done,total))}</span><span class="bar"><i style="width:${Math.round(done/total*100)}%"></i></span></span>`);

  const n = activeCount();
  const fcnt = document.getElementById('fcnt'); if (fcnt) fcnt.textContent = n || '';

  if (!hits.length){
    box.innerHTML = `<div class="empty"><b>${esc(t('none'))}</b>${esc(t('noneHint'))}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  let cur = null;
  for (const e of hits){
    if (e.sec !== cur){
      cur = e.sec;
      const s = sectionFor(cur), zhFallback = state.lang!=='zh' && e.lang==='zh';
      const head = document.createElement('div');
      head.className = 'sec-h'; head.id = 'sec-'+cur;
      head.innerHTML = `<h2>${cur}. ${esc(s?.title||'')}</h2>`+
        (zhFallback ? `<span class="shown">${esc(t('untrans'))}</span>` : '');
      frag.appendChild(head);
      if (s?.intro?.length){
        const ip = document.createElement('div');
        ip.className = 'intro'; ip.id = 'intro-'+cur;
        ip.innerHTML = s.intro.map(p=>`<p>${linkRefs(inline(p),cur)}</p>`).join('');
        frag.appendChild(ip);
      }
    }
    frag.appendChild(card(e));
  }
  box.replaceChildren(frag);
}

/* ---------- left rail ---------- */
const chipRow = (dim,vals) => `<div class="chips">`+vals.map(v =>
  `<button class="chip" data-dim="${dim}" data-val="${esc(v)}" aria-pressed="${state[dim].has(v)}">${esc(dim==='grade'?v:tagText(dim,v))}</button>`
).join('')+`</div>`;

function renderRail(){
  const counts = {};
  for (const e of allEntries()) counts[e.sec] = (counts[e.sec]||0)+1;
  const group = (title, body) => `<div class="group"><div class="gt">${esc(title)}</div>${body}</div>`;
  const secs = visibleSections().map(s=>{
    const sec = sectionFor(s), zh = state.lang!=='zh' && !MANIFEST[state.lang].includes(s);
    return `<button class="sec-link" data-dim="sec" data-val="${s}" aria-pressed="${state.sec.has(s)}">
      <span>${s}. ${esc(sec?.title||'…')}${zh?' · 中':''}</span><i>${counts[s]??0}</i></button>`;
  }).join('');
  document.getElementById('rail').innerHTML =
    `<div class="group secs"><div class="gt">${esc(t('fSec'))}</div><div class="sec-links">${secs}</div></div>`+
    group(t('fRatio'), chipRow('ratio',['极高','高','一般']))+
    group(t('fLens'), chipRow('lens',['死亡率','金钱','时间','自由']))+
    group(t('fGrade'), chipRow('grade',['A','B','C']))+
    group(t('fMoney'), chipRow('money',['0','少','多']))+
    group(t('fTime'), chipRow('time',['少','中','多']))+
    group(t('fWill'), chipRow('will',['否','些','是']))+
    `<div class="group">`+
      (state.lang==='zh' ? '' : `<label class="sw"><input type="checkbox" id="showUn" ${state.showUn?'checked':''}><span>${esc(t('showUn'))}</span></label>`)+
      `<button class="clear" id="clearAll">${esc(t('clear'))}</button>`+
    `</div>`;
}

/* ---------- chrome ---------- */
function syncHead(){
  const h = Math.ceil(document.querySelector('header').offsetHeight);
  document.documentElement.style.setProperty('--nav-h', h+'px');
  document.documentElement.style.setProperty('--head', h+'px');
}
function applyLang(){
  document.documentElement.lang = HTML_LANG[state.lang];
  document.getElementById('brand').textContent = t('title');
  document.title = t('title');
  document.getElementById('q').placeholder = t('search');
  document.getElementById('noticeText').innerHTML = t('notice');
  document.getElementById('menu').setAttribute('aria-label', t('filters'));
  document.getElementById('footer').innerHTML = t('footer');
  const l = document.getElementById('loadText'); if (l) l.textContent = t('loading');
  for (const b of document.querySelectorAll('#langSeg button'))
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
  syncHead();
}

/* ---------- url ---------- */
function writeUrl(){
  const p = new URLSearchParams();
  if (state.lang!=='en') p.set('lang',state.lang);
  if (state.q) p.set('q',state.q);
  if (state.sec.size) p.set('sec',[...state.sec].join(','));
  for (const d of DIMS) if (state[d].size) p.set(d,[...state[d]].join(','));
  if (state.showUn) p.set('all','1');
  const qs = p.toString();
  history.replaceState(null,'',qs?'?'+qs:location.pathname);
}
function readUrl(){
  const p = new URLSearchParams(location.search);
  if (LANGS.includes(p.get('lang'))) state.lang = p.get('lang');
  state.q = p.get('q')||'';
  state.sec = new Set((p.get('sec')||'').split(',').filter(Boolean));
  for (const d of DIMS) state[d] = new Set((p.get(d)||'').split(',').filter(Boolean));
  state.showUn = p.get('all')==='1';
}

let busy = false, again = false;
async function refresh({rail=true}={}){
  if (busy){ again = true; return; }
  busy = true;
  try {
    do {
      again = false;
      await ensureLoaded();
      if (again) continue;
      if (rail) renderRail();
      render();
      writeUrl();
    } while (again);
  } finally { busy = false; }
}

async function goTo(key){
  const [sec] = key.split('-');
  if (!MANIFEST.zh.includes(sec)) return;
  if (state.lang!=='zh' && !MANIFEST[state.lang].includes(sec) && !state.showUn) state.showUn = true;
  if (state.sec.size && !state.sec.has(sec)) state.sec = new Set();
  await refresh();
  let el = document.getElementById('e-'+key);
  if (!el){
    state.q=''; document.getElementById('q').value='';
    for (const d of DIMS) state[d] = new Set();
    await refresh();
    el = document.getElementById('e-'+key);
  }
  if (el){
    el.scrollIntoView({behavior:'smooth',block:'start'});
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
}

async function toggleZh(key, btn){
  const c = document.getElementById('e-'+key); if (!c) return;
  const open = c.querySelector('.orig');
  if (open){ open.remove(); btn.textContent = t('showZh'); return; }
  const [sec,n] = key.split('-');
  await loadSection('zh',sec);
  const z = CORPUS.zh?.[sec]?.entries.find(x=>x.n===n);
  if (!z){ btn.textContent = t('notLoaded'); return; }
  const L = LABELS.zh, row = (dt,dd)=>`<div class="k">${esc(dt)}</div><div class="v">${dd}</div>`;
  const b = document.createElement('div');
  b.className = 'orig';
  b.innerHTML = `<h5>${esc(t('zhHead'))}</h5><p class="ot">${inline(z.title)}</p><div class="rows">`+
    (z.human?row(L.human,inline(z.human)):'')+(z.cost?row(L.cost,inline(z.cost)):'')+
    (z.gain?row(L.gain,inline(z.gain)):'')+(z.note?row(L.note,inline(z.note)):'')+`</div>`;
  c.querySelector('.detail').appendChild(b);
  btn.textContent = t('hideZh');
}

/* ---------- events ---------- */
function setMenu(on){
  document.getElementById('aside').classList.toggle('open', on);
  document.getElementById('backdrop').classList.toggle('on', on);
  document.getElementById('menu').setAttribute('aria-expanded', String(on));
  document.documentElement.classList.toggle('menu-open', on);
}
function wire(){
  const q = document.getElementById('q');

  document.getElementById('langSeg').addEventListener('click', async ev => {
    const b = ev.target.closest('button[data-lang]');
    if (!b || b.dataset.lang === state.lang) return;
    state.lang = b.dataset.lang; applyLang(); await refresh();
  });
  document.getElementById('themeBtn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('hltb-i18n-theme', dark?'light':'dark'); } catch(e){}
  });
  document.getElementById('noticeX').addEventListener('click', () => {
    document.getElementById('notice').classList.add('hide');
    try { localStorage.setItem('hltb-i18n-notice','off'); } catch(e){}
  });
  try { if (localStorage.getItem('hltb-i18n-notice')==='off') document.getElementById('notice').classList.add('hide'); } catch(e){}

  let timer = null;
  q.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = q.value.trim(); render(); writeUrl(); }, 140);
  });

  document.getElementById('menu').addEventListener('click', () => {
    setMenu(!document.getElementById('aside').classList.contains('open'));
  });
  document.getElementById('backdrop').addEventListener('click', () => setMenu(false));

  const rail = document.getElementById('rail');
  rail.addEventListener('click', ev => {
    const chip = ev.target.closest('[data-dim]');
    if (chip){
      const {dim,val} = chip.dataset;
      state[dim].has(val) ? state[dim].delete(val) : state[dim].add(val);
      renderRail(); render(); writeUrl(); return;
    }
    if (ev.target.closest('#clearAll')){
      state.q=''; q.value=''; state.sec = new Set();
      for (const d of DIMS) state[d] = new Set();
      renderRail(); render(); writeUrl();
    }
  });
  rail.addEventListener('change', async ev => {
    if (ev.target.id === 'showUn'){ state.showUn = ev.target.checked; await refresh(); }
  });

  document.getElementById('results').addEventListener('click', ev => {
    const ref = ev.target.closest('.ref[data-go]');
    if (ref){ ev.preventDefault(); goTo(ref.dataset.go); return; }
    const zb = ev.target.closest('[data-zh]');
    if (zb){ toggleZh(zb.dataset.zh, zb); return; }
  });

  document.addEventListener('keydown', ev => {
    if (ev.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){ ev.preventDefault(); q.focus(); }
    else if (ev.key === 'Escape'){
      if (document.getElementById('aside').classList.contains('open')) setMenu(false);
      else if (document.activeElement === q){ q.value=''; state.q=''; render(); writeUrl(); }
    }
  });
  addEventListener('resize', syncHead);
}

/* ---------- boot ---------- */
(async function init(){
  readUrl(); wire(); applyLang();
  document.getElementById('q').value = state.q;
  try { MANIFEST = await (await fetch('manifest.json',{cache:'no-cache'})).json(); }
  catch(err){
    document.getElementById('results').innerHTML =
      `<div class="empty"><b>${esc(t('failed'))}</b>${esc(t('failedHint'))}</div>`;
    return;
  }
  if (state.lang!=='zh' && !MANIFEST[state.lang].length) state.showUn = true;
  await refresh();
})();
</script>
</body>
</html>
